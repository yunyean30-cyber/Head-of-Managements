  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script>
      // Gracefully ignore benign Vite HMR WebSocket errors in sandbox preview environments
      const _origError = console.error;
      console.error = function (...args) {
        if (typeof args[0] === 'string' && (args[0].includes('WebSocket closed without opened') || args[0].includes('[vite] Error: WebSocket'))) {
          return;
        }
        _origError.apply(console, args);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
