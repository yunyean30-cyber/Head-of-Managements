<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle circular ornament -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="160" fill="#047857" fill-opacity="0.5" />
  
  <!-- KHR Symbol / Shield & Coin Emblem -->
  <g filter="url(#shadow)">
    <!-- Shield / Bank Base -->
    <path d="M256 80 L370 135 V240 C370 320 256 390 256 390 C256 390 142 320 142 240 V135 Z" fill="#022c22" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Khmer Riel ៛ Symbol -->
    <text x="256" y="278" font-family="'Battambang', 'Kantumruy Pro', sans-serif" font-size="140" font-weight="bold" fill="url(#gold)" text-anchor="middle" dominant-baseline="central">៛</text>
  </g>
  
  <!-- Calender / 21-22 Days indicator badge -->
  <rect x="176" y="405" width="160" height="42" rx="21" fill="url(#gold)" />
  <text x="256" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#022c22" text-anchor="middle" letter-spacing="1.5">DAILY 21/22</text>
</svg>
